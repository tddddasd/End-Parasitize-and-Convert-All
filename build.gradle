plugins {
    id 'java-library'
    id 'idea'
    alias libs.plugins.modDevGradle
}

version = "${mod_version}"
group = 'org.tdddd'
base.archivesName = "${mod_id}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets.main.java.srcDir 'compat/playeranimator'

sourceSets.main.resources {
    // src/generated/resources        <- 客户端数据生成输出 (gradlew runData)
    // src/generated/server-resources <- 服务端数据生成输出 (gradlew runDataServer)
    // 两个 run 必须用不同的输出目录：datagen 的 HashCache 会把「本次运行没有写」的文件当 stale 删掉，
    // 若共用一个目录，client/server 轮流跑会互相清空对方的产物。
    srcDirs 'src/main/resources', 'src/generated/resources', 'src/generated/server-resources'
    exclude 'META-INF/mods.toml.1.20.1'
}

repositories {
    mavenLocal()
    maven { url = 'file:///G:/PCL/libraries' }   // launcher-provided runtime libraries (Maven layout)
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

neoForge {
    version = libs.versions.neoForge.get()

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            serverData()
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        dataServer {
            // 26.1.2: 客户端与服务端数据生成是两个不同的事件（GatherDataEvent.Client / .Server）。
            // 同一个 run 里同时写 serverData() 和 clientData() 时只有后者生效（dist 只有一个），
            // 所以 runData 实际上只跑客户端 provider，服务端那一半
            // （tags / recipes / worldgen，以及 CustomDataProviders 的
            //   entity_conversions / entity_carry / block_conversions / biomass_spawns）
            // 必须用这个独立的 run 生成。
            //
            //   gradlew runDataServer                     -> 写入 src/generated/server-resources
            //   gradlew runDataServer -PdatagenOutput=build/datagen-server
            //                                             -> 先写到临时目录核对，不动源码
            serverData()
            def datagenOut = providers.gradleProperty('datagenOutput').getOrElse('src/generated/server-resources')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file(datagenOut).getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
        // GeckoLib 5 - hard dependency: epca's entity/item renderers extend its classes.
    implementation files('libs/geckolib-neoforge-26.1.2-5.5.2.jar')

    // Jade - optional integration; its plugin classes are only touched when Jade is present.
    compileOnly files('libs/Jade-mc26.1-NeoForge-26.1.11.jar')
    runtimeOnly files('libs/Jade-mc26.1-NeoForge-26.1.11.jar')

    // Sibling mods, ported and built for 26.1.2 in this same session.
    // YawningNekoAPI 内置（jar-in-jar）：随 epca 一起分发，玩家无需单独安装
    jarJar(implementation files('libs/yawning_neko_api-1.0.5.jar'))
    implementation files('libs/eej-26.1.2.jar')

    // player-animator has no 26.1.2 build; the no-op shim in compat/playeranimator supplies its API.
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.named('processResources').configure {
    // main/resources and generated/resources may contain the same file; keep the first
    duplicatesStrategy = 'EXCLUDE'
}