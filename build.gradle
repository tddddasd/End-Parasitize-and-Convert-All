buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'maven-publish'
}

ext {
    minecraftVersions = [
            '1.20': '46.0.10',
            '1.20.1': '47.2.0'
    ]

    defaultMcVersion = '1.20.1'
}

def getTargetVersion() {
    return project.hasProperty('mc_version') ? project.mc_version : defaultMcVersion
}

def getMappingsVersion() {
    return getTargetVersion()
}

def getForgeVersion() {
    return minecraftVersions[getTargetVersion()]
}

def getModVersion() {
    return "${mod_version}-${getTargetVersion()}"
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = getModVersion()

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def mappingsVersion = providers.provider { getMappingsVersion() }
def targetMcVersion = providers.provider { getTargetVersion() }
def targetForgeVersion = providers.provider { getForgeVersion() }

minecraft {
    jarJar.enable()

    mappings channel: mapping_channel, version: mappingsVersion.get()
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    // Default run configurations.
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "epca.refmap.json"
    config "epca.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir { dir 'libs' }

    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    maven { // Registrate
        url "https://maven.tterrag.com/"
    }

    maven {
        url "https://www.cursemaven.com"
    }

    mavenLocal()
}

dependencies {
    minecraft "net.minecraftforge:forge:${targetMcVersion.get()}-${targetForgeVersion.get()}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // GeckoLib + mclib from Cloudsmith Maven (jar-in-jar)
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.7.1")
    implementation fg.deobf("com.eliotlash.mclib:mclib:20")

    implementation fg.deobf("org.tdddd.yawning_neko_api:yawningapi:1.0.0")
    // Other external mods
    implementation fg.deobf("curse.maven:jade-324717:6855440")
    implementation fg.deobf("curse.maven:jei-238222:8677648")
    implementation fg.deobf("curse.maven:patchouli-306770:7731017")

    // Photon + LDLib (explicit ldlib version for Forge 47.2.0 compatibility)
    implementation fg.deobf("curse.maven:ldlib-626676:6417175")  // ldlib 1.0.39, compatible with Forge 47.2.0
    implementation fg.deobf("curse.maven:photon-871522:6878530")
    implementation fg.deobf("curse.maven:ca-1264722:8546534")

    // Registrate
    implementation fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.0")
    jarJar(group: 'com.tterrag.registrate', name: 'Registrate', version: "[MC1.20,)")

    // Jar-in-Jar: bundle all shipped libraries
    jarJar(group: 'software.bernie.geckolib', name: 'geckolib-forge-1.20.1', version: '[4.7.1,4.8)')
    jarJar(group: 'com.eliotlash.mclib', name: 'mclib', version: '[20,)')
    jarJar(group: 'org.tdddd.yawning_neko_api', name: 'yawningapi', version: '[1.0.0,)')
}

minecraftVersions.each { mcVersion, forgeVersion ->
    def taskName = "buildForMc${mcVersion.replace('.', '_')}"

    task (taskName, type: GradleBuild) {
        group = 'build'
        description = "${mcVersion} build"

        tasks = ['build']
        startParameter.projectProperties = ['mc_version': mcVersion]
    }
}

task devJar(type: Jar) {
    archiveClassifier = 'dev'
    from sourceSets.main.output
    manifest.from(jar.manifest)
}
task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}
build.dependsOn devJar, sourcesJar

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact devJar //dev
            artifact sourcesJar //source
        }
    }
    repositories {
        maven {
            name = "localDir"
            url = "file://${project.projectDir}/build/repo"
        }
    }
}

task buildAllVersions {
    group = 'build'
    description = 'build all'

    dependsOn minecraftVersions.keySet().collect { "buildForMc${it.replace('.', '_')}" }

    doLast {
        minecraftVersions.each { mcVersion, forgeVersion ->
            def jarFile = file("build/libs/${mod_id}-${mod_version}-${mcVersion}.jar")
            if (jarFile.exists()) {
                println "${jarFile.name} (${jarFile.length()} bytes)"
            }
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: targetMcVersion.get(),
            minecraft_version_range: minecraft_version_range,
            forge_version: targetForgeVersion.get(),
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
    from(layout.buildDirectory.dir("main/resources/META-INF")) {
        include "epca.refmap.json"
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    archiveVersion = "${mod_version}-${targetMcVersion.get()}"

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
