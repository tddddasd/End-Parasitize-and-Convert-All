plugins {
    id 'java-library'
    id 'idea'
    alias libs.plugins.modDevGradle
}

version = "${mod_version}"
group = 'org.tdddd'
base.archivesName = "${mod_id}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets.main.resources {
    srcDirs 'src/main/resources', 'src/generated/resources', 'src/generated/server-resources'
    exclude 'META-INF/mods.toml.1.20.1'
}

repositories {
    mavenLocal()
    maven { url = 'file:///G:/PCL/libraries' }   // launcher-provided runtime libraries (Maven layout)
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

neoForge {
    version = libs.versions.neoForge.get()

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            serverData()
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        dataServer {
            //
            //   gradlew runDataServer -PdatagenOutput=build/datagen-server
            serverData()
            def datagenOut = providers.gradleProperty('datagenOutput').getOrElse('src/generated/server-resources')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file(datagenOut).getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
        // GeckoLib 5 - hard dependency: epca's entity/item renderers extend its classes.
    // 用 Maven 坐标声明（而非 libs/ 平铺 jar）：MDG 的 jarJar 才能拿到真正的 group/artifact/version
    // 写入 META-INF/jarjar/metadata.json，且无需给嵌套 jar 补 Automatic-Module-Name。
    // 精确版本（不用动态区间）：--offline 下区间需要版本列表才能解析，会直接失败。
    jarJar(implementation("com.geckolib:geckolib-neoforge-26.1.2:5.5.2"))

    // Jade - optional integration; its plugin classes are only touched when Jade is present.
    compileOnly files('libs/Jade-mc26.1-NeoForge-26.1.11.jar')
    runtimeOnly files('libs/Jade-mc26.1-NeoForge-26.1.11.jar')

    // Sibling mods, ported and built for 26.1.2 in this same session.
    jarJar(implementation files('libs/yawning_neko_api-1.0.5.jar'))
    implementation files('libs/eej-26.1.2.jar')

    // EPCA-Physics - hard prerequisite: the physicalized infested carved pumpkin (the
    // `epca:infested_carved_pumpkin_physics` entity) extends its `PhysicsEntity` base class, so this
    // jar is also a mandatory `[[dependencies.epca]]` entry in
    // src/main/templates/META-INF/neoforge.mods.toml, mirroring the eej / yawning_neko_api entries.
    implementation files('libs/epca_physics-1.0.0.jar')

    // ... and, exactly like `yawning_neko_api-1.0.5.jar` above, the physics mod is embedded in this
    // tree's own output as a jar-in-jar so the packed build ships it.
    jarJar(implementation files('libs/epca_physics-1.0.0.jar'))

    // Player Animation Library (ZigyTheBird fork, modId `player_animation_library`) - hard prerequisite:
    // the mod's player animations are built on its API and there is no upstream 26.1.2 build, so the 26.1
    // merged jar lives in libs/ (and is declared as a required dependency in neoforge.mods.toml).
    compileOnly files('libs/PlayerAnimationLibMerged-1.2.6+mc.26.1.jar')
    runtimeOnly files('libs/PlayerAnimationLibMerged-1.2.6+mc.26.1.jar')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
tasks.named('processResources').configure {
    // main/resources and generated/resources may contain the same file; keep the first
    duplicatesStrategy = 'EXCLUDE'
}